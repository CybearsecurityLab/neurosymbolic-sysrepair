# Neurosymbolic solver presets.
# Usage:  python -m neurosymbolic.run <preset>

defaults:
  message_limit: 50
  max_connections: 2
  log_dir: ./logs/neurosymbolic
  time_limit: 2400
  token_limit: 800000
  bash_timeout: 240
  verify_timeout: 360
  fail_on_error: 0.25
  retry_on_error: 2
  domain_path: ./pddl_output/phase3/sysadmin_refined.pddl
  fd_path: /home/resbears/fast_downward/fast-downward.py
  plan_timeout: 120
  enable_llm_fallback: true

presets:
  # Quick smoke test
  smoke:
    model: openai/MiniMax-M2.7
    scenarios: ["ccdc/scenario-01"]
    message_limit: 30

  # Day-1 mode: full threat briefing
  day1:
    model: openai/gemma-4-31b
    mode: day1
    benchmarks: ["ccdc", "meta2", "meta3/ubuntu", "vulnhub", "meta4"]

  # Zero-day mode: blind discovery
  zero_day:
    model: openai/gemma-4-31b
    mode: zero_day
    benchmarks: ["ccdc", "meta2", "meta3/ubuntu", "vulnhub", "meta4"]
    message_limit: 100
    time_limit: 0
    token_limit: 0

  # Ablation: unrefined domain (Phase 2 output, no Exploration Walk refinement)
  ablation_no_refinement:
    model: openai/gemma-4-31b
    mode: day1
    benchmarks: ["ccdc", "meta2", "meta3/ubuntu", "vulnhub", "meta4"]
    domain_path: ./pddl_output/phase2/sysadmin.pddl

  # Ablation: no planner (LLM fallback only, but with domain context)
  ablation_no_planner:
    model: openai/gemma-4-31b
    mode: day1
    benchmarks: ["ccdc", "meta2", "meta3/ubuntu", "vulnhub", "meta4"]
    fd_path: ""  # disable planner — forces immediate LLM fallback

  # Ablation: no fallback (planner-only, no LLM recovery)
  ablation_no_fallback:
    model: openai/gemma-4-31b
    mode: day1
    benchmarks: ["ccdc", "meta2", "meta3/ubuntu", "vulnhub", "meta4"]
    enable_llm_fallback: false

  # CCDC only (50 scenarios, quick iteration)
  ccdc_day1:
    model: openai/gemma-4-31b
    mode: day1
    benchmarks: ["ccdc"]
