[project]
name = "auto-sysrepair"
version = "0.1.0"
description = "Autonomous System Remediation Tool"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "langextract>=1.1.1",
    "osquery>=3.1.1",
    "pddl>=0.3.1",
    "torch>=2.9.0",
    "vllm==0.13.0; sys_platform != 'darwin'",
]

[tool.uv]
preview = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [{ index = "pytorch-cu130" }]
xformers = [{ index = "pytorch-cu130" }]

vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.13.0/vllm-0.13.0+cu130-cp38-abi3-manylinux_2_35_x86_64.whl" }

[tool.uv.extra-build-dependencies]
vllm = [
    "setuptools",
    "wheel",
    "torch",
    "ninja",
    "packaging",
]
